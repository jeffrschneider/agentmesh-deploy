# A mesh on Kubernetes.
#
#   kubectl create namespace agentmesh
#   # credentials come from OUTSIDE the cluster: see the README
#   kubectl -n agentmesh create secret generic mesh-config --from-file=accounts.conf=./accounts.conf
#   kubectl -n agentmesh create secret generic services-creds --from-file=services.creds=./creds/services.creds
#   kubectl -n agentmesh create secret generic sandbox-pool --from-file=./creds/pool/
#   kubectl -n agentmesh create secret generic bridge-creds --from-file=bridge.creds=./creds/bridge.creds
#   kubectl -n agentmesh create secret generic bridge-api-keys --from-literal=api-keys='<key>=<label>'
#   kubectl -n agentmesh apply -f mesh.yaml
#
# The last two are for the A2A bridge. Both are optional in the mechanical
# sense — the manifest marks them optional so a missing one does not wedge the
# pod — and both change what the bridge can do: with no credential it cannot
# reach the mesh, and with no API keys it refuses every inbound call. See the
# bridge Deployment at the bottom.
#
# The shape to understand before reading further: objects with different scaling
# rules, which is why they are different objects.
#
#   elastic  the console. Static files, no state, no subscriptions. Scale it
#            freely; an autoscaler belongs here and nowhere else.
#            The eval agent is elastic too, with one caveat: its rate limiter is
#            per-pod, so N replicas is N times the cap it advertises.
#   pinned   the services. Exactly one replica, and that is a correctness
#            requirement rather than a cost choice: no subscription in the tier
#            uses a NATS queue group, so NATS fans every request out to every
#            subscriber and a second instance would both do the work and ANSWER
#            a second time. Two local files (the usage counters and the console
#            login hash) are per-replica on top of that.
#            See docs/planning-and-sizing.md, section 4.3.
#            The bridge is pinned as well, for a different reason: each replica
#            is its own mesh node and attaches the eval agent under its own
#            hosted identity, so two replicas put two of the same agent in the
#            registry under two different ids.
#   ballast  nats. Raft-replicated JetStream. The replica count is a decision,
#            not a dial. An autoscaler pointed at this will eventually eat data.
#            Note what it does and does not buy: application streams and KV
#            buckets are all single-replica today, so three servers give you
#            connection failover, not data redundancy.
#            See docs/planning-and-sizing.md, section 4.2.
#
# Never let a scaler see anything but the console and the eval agent.

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: agentmesh
data:
  nats.conf: |
    server_name: $POD_NAME
    port: 4222
    http: 8222

    # Set explicitly, not inherited. Two reasons. It is a contract: the API
    # advertises exactly this figure to clients as `max_message_bytes` and
    # refuses request bodies larger than it (services/src/api/api-service.ts,
    # `max_message_bytes: 1024 * 1024` in the plan response and `MAX_BODY_BYTES`
    # on the request path), so a broker that disagreed would either reject what
    # the API accepted or accept what the API promised to refuse. And a default
    # is not a decision: the server's own default happens to be the same 1 MiB
    # today, and writing it down is what stops a version bump from moving it.
    max_payload: 1048576

    # The next three settings are the graceful-shutdown half of this config, and
    # they only make sense read together with the preStop hook and
    # terminationGracePeriodSeconds on the StatefulSet below.
    #
    # The hook runs `nats-server --signal ldm=/var/run/nats/nats.pid`.
    # That form of the signal reads the pid out of a file, so the file has to
    # exist: without this line nothing ever writes one, the hook fails, and the
    # drain silently does not happen. Declared here rather than as `-P` on the
    # command line because every other server setting is in this file and the
    # container args carry only the path to it. The directory is an emptyDir
    # mounted at /var/run/nats; the two paths have to stay in step.
    pid_file: "/var/run/nats/nats.pid"

    # Three numbers that have to agree with terminationGracePeriodSeconds: 75
    # on the pod. The arithmetic:
    #
    #   lame_duck_grace_period  10s  after entering lame duck the server stops
    #                                accepting and leaves existing connections
    #                                alone this long, so clients see the notice
    #                                and reconnect elsewhere on their own
    #   lame_duck_duration      45s  TOTAL time in lame duck, grace period
    #                                INCLUDED. The server spreads connection
    #                                closes over duration minus grace, so 35s
    #                                of eviction follows the 10s hold
    #   grace period            75s  45s of drain, then 30s of margin for the
    #                                preStop dispatch and the shutdown that
    #                                follows the last close
    #
    # The shipped default is 2m, which does not fit in 75s at all: the kubelet
    # would SIGKILL the pod partway through the drain, which is the outage the
    # drain exists to prevent. Bounds on these two: nats-server enforces a
    # 30 second floor on lame_duck_duration, and refuses to start if the grace
    # period is not strictly lower than the duration.
    lame_duck_duration: "45s"
    lame_duck_grace_period: "10s"

    jetstream {
      store_dir: "/data/jetstream"
      max_mem: 1G
      max_file: 8G
    }

    websocket {
      port: 4443
      no_tls: true   # TLS terminates at the ingress. See the README.
    }

    cluster {
      name: agentmesh
      port: 6222
      routes: [
        nats://nats-0.nats.agentmesh.svc.cluster.local:6222
        nats://nats-1.nats.agentmesh.svc.cluster.local:6222
        nats://nats-2.nats.agentmesh.svc.cluster.local:6222
      ]
    }

    # Bare filename, not a path. nats-server resolves includes RELATIVE to the
    # directory holding the config, so an absolute path here gets appended to
    # that directory and becomes /etc/nats/etc/... which does not exist. Both
    # files therefore have to land in the same directory, which is what the
    # projected volume below is for: nats.conf from a ConfigMap and
    # accounts.conf from a Secret, presented as one directory.
    include "accounts.conf"

---
# Headless, so each pod gets a stable DNS name for the cluster routes above.
apiVersion: v1
kind: Service
metadata:
  name: nats
  namespace: agentmesh
spec:
  clusterIP: None
  # REQUIRED, and a deadlock if omitted: a headless service publishes DNS only
  # for READY pods by default, but these pods cannot become ready until they
  # have clustered with each other, and cannot cluster until they can resolve
  # each other. Without this they spin on "no such host" until the liveness
  # probe kills them, and the cluster never forms.
  publishNotReadyAddresses: true
  selector:
    app: nats
  ports:
    - { name: client, port: 4222 }
    - { name: cluster, port: 6222 }
    - { name: websocket, port: 4443 }
    - { name: monitor, port: 8222 }

---
# What everything else connects to.
apiVersion: v1
kind: Service
metadata:
  name: nats-client
  namespace: agentmesh
spec:
  selector:
    app: nats
  ports:
    - { name: client, port: 4222, targetPort: 4222 }
    - { name: websocket, port: 4443, targetPort: 4443 }

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: nats
  namespace: agentmesh
spec:
  serviceName: nats
  # Three, and an odd number, because JetStream replication is Raft: quorum is
  # two of three. Changing this is a migration, not an edit — see the README's
  # scale-in runbook before touching it.
  replicas: 3
  podManagementPolicy: Parallel
  selector:
    matchLabels: { app: nats }
  template:
    metadata:
      labels: { app: nats }
    spec:
      # Three replicas on two nodes loses quorum when one node drains, which is
      # the whole point of having three. Spread them.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels: { app: nats }
      # 45s of lame duck drain plus 30s of margin. This number and the two
      # lame_duck_* settings in the ConfigMap are one decision in two places:
      # raising the drain without raising this gets the pod killed mid-handoff.
      terminationGracePeriodSeconds: 75
      containers:
        - name: nats
          image: nats:2.10-alpine
          args: ["-c", "/etc/nats/nats.conf", "--name", "$(POD_NAME)"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef: { fieldPath: metadata.name }
          ports:
            - { name: client, containerPort: 4222 }
            - { name: cluster, containerPort: 6222 }
            - { name: websocket, containerPort: 4443 }
            - { name: monitor, containerPort: 8222 }
          lifecycle:
            preStop:
              # Lame duck: stop accepting, tell connected clients to reconnect
              # elsewhere, then exit. Without this a rolling restart looks like
              # an outage to every agent.
              #
              # The hook returns as soon as the signal is delivered, and the
              # kubelet then sends SIGTERM to a server that is still draining.
              # That is survivable on purpose: nats-server ignores SIGTERM once
              # lame duck mode is already in progress, so the drain runs to
              # completion on the lame_duck_* schedule in the ConfigMap and the
              # only real deadline is terminationGracePeriodSeconds above.
              exec:
                command: ["nats-server", "--signal", "ldm=/var/run/nats/nats.pid"]
          volumeMounts:
            - { name: config, mountPath: /etc/nats, readOnly: true }
            - { name: data, mountPath: /data }
            - { name: pid, mountPath: /var/run/nats }
          readinessProbe:
            httpGet: { path: /healthz, port: 8222 }
            initialDelaySeconds: 5
            periodSeconds: 5
          # Liveness must NOT use /healthz. While the cluster is forming and
          # JetStream is recovering, /healthz reports unhealthy, so liveness on it
          # kills the pod mid-formation and the cluster never converges. /varz
          # answers as soon as the server is listening, which is what liveness
          # should mean. /healthz stays on readiness, where it gates traffic.
          livenessProbe:
            httpGet: { path: /varz, port: 8222 }
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 6
          startupProbe:
            httpGet: { path: /varz, port: 8222 }
            failureThreshold: 30
            periodSeconds: 5
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { cpu: "1", memory: 2Gi }
      volumes:
        # nats.conf and accounts.conf must sit in ONE directory, because
        # nats-server resolves an include relative to the config it is reading.
        # A projected volume is how two different sources become one directory.
        - name: config
          projected:
            sources:
              # Note `name`, not `secretName`. A projected source is a different
              # type from a secret volume, and uses `name` for both kinds.
              - configMap: { name: nats-config }
              - secret: { name: mesh-config }
        - name: pid
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: services
  namespace: agentmesh
spec:
  # Recreate, not the default RollingUpdate, for two independent reasons.
  #
  # Mechanical: the state volume is a ReadWriteOnce PVC, and a rolling update
  # brings the replacement pod up before the old one is gone. ReadWriteOnce is
  # per NODE, so which way this breaks depends on where the replacement lands.
  # On another node it cannot attach the volume at all: it stays Pending with a
  # FailedAttachVolume / Multi-Attach event, the old pod keeps serving, and the
  # rollout never completes without someone deleting the old pod by hand.
  #
  # Correctness: on the SAME node it does attach, starts, and that is the worse
  # outcome, because two instances of this tier are wrong. No subscription here
  # uses a NATS queue group, so both would answer every request, and both would
  # be writing the same usage counters and the same console login hash. See the
  # replica note directly below. Recreate is what makes "exactly one" true
  # DURING a deploy and not only after it.
  #
  # The price is a few seconds with no API while the new pod starts. That is the
  # honest shape of a tier that cannot run two of itself, and a predictable gap
  # is better than either a stall or a brief double.
  strategy:
    type: Recreate
  # NOT safe to raise, and this is not a throughput note. No subscription in the
  # services tier uses a NATS queue group, so NATS delivers every message to
  # every subscriber: two replicas would both do the work and both reply to a
  # single request. The usage counters and the console login hash are per-replica
  # local files as well. One is the only supported value. The README and
  # docs/planning-and-sizing.md section 4.3 have the full reason.
  replicas: 1
  selector:
    matchLabels: { app: services }
  template:
    metadata:
      labels: { app: services }
    spec:
      # A new PersistentVolume is mounted root-owned, which masks the ownership
      # the image set up and gives the non-root user EACCES on first write.
      # fsGroup makes the volume group-writable for this gid. The image runs as
      # uid/gid 1000 (the node user).
      securityContext:
        fsGroup: 1000
      containers:
        - name: services
          image: ghcr.io/jeffrschneider/agentmesh-services:0.2.1
          env:
            - name: NATS_URL
              value: nats://nats-client.agentmesh.svc.cluster.local:4222
            - name: NATS_CREDS
              value: /creds/services.creds
            - name: CREDS_DIR
              value: /creds/pool
            - name: USAGE_DB_PATH
              value: /var/lib/agentmesh/usage.db
            # Sign-in mail. The image bakes NODE_ENV=production in, and in
            # production the services refuse to start without RESEND_API_KEY,
            # because the fallback mailer prints working sign-in links. This
            # bundle opts into dev mode instead: links print into the services
            # log, which on your own cluster is your own log. For real email,
            # set RESEND_API_KEY from a Secret, set NODE_ENV to production,
            # and drop MESH_DEV_MODE.
            - name: NODE_ENV
              value: development
            - name: MESH_DEV_MODE
              value: "1"
            - name: MESH_OPERATOR_AUTH_FILE
              value: /var/lib/agentmesh/operator-auth.json
            - name: MESH_OPERATOR_ID
              value: operator
            # No password set, so the first start invents one and prints it:
            #   kubectl -n agentmesh logs deploy/services | grep -A6 "OPERATOR CONSOLE LOGIN"
            # There is deliberately no default: this image is public and this
            # login can mint credentials.
          ports:
            - { name: api, containerPort: 3001 }
          volumeMounts:
            - { name: creds, mountPath: /creds/services.creds, subPath: services.creds, readOnly: true }
            - { name: pool, mountPath: /creds/pool, readOnly: true }
            - { name: state, mountPath: /var/lib/agentmesh }
          readinessProbe:
            httpGet: { path: /healthz, port: 3001 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: creds
          secret: { secretName: services-creds }
        - name: pool
          secret: { secretName: sandbox-pool }
        # The activity service keeps usage counters, and the entrypoint writes
        # the console login hash, both here. Per-replica: see the README before
        # raising replicas above one.
        - name: state
          persistentVolumeClaim: { claimName: services-state }

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: services-state
  namespace: agentmesh
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

---
apiVersion: v1
kind: Service
metadata:
  name: services
  namespace: agentmesh
spec:
  selector:
    app: services
  ports:
    - { name: api, port: 3001, targetPort: 3001 }

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: console
  namespace: agentmesh
spec:
  replicas: 2
  selector:
    matchLabels: { app: console }
  template:
    metadata:
      labels: { app: console }
    spec:
      containers:
        - name: console
          image: ghcr.io/jeffrschneider/agentmesh-console:0.2.1
          env:
            # Resolved by the BROWSER, so these are the addresses a user's
            # machine can reach, never in-cluster service names. Set them to
            # your ingress hostnames; the placeholders below only work for
            # kubectl port-forward.
            - name: API_URL
              value: http://localhost:3001
            - name: NATS_WS_URL
              value: ws://localhost:4443
          ports:
            - { name: http, containerPort: 8080 }
          readinessProbe:
            httpGet: { path: /config.js, port: 8080 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 200m, memory: 256Mi }

---
apiVersion: v1
kind: Service
metadata:
  name: console
  namespace: agentmesh
spec:
  selector:
    app: console
  ports:
    - { name: http, port: 8080, targetPort: 8080 }

---
# The A2A eval agent: a stateless HTTP agent whose answer is predictable, so
# post-install validation can assert an exact value rather than "something came
# back". No credential, no mesh connection, no storage. The bridge below is what
# puts it on the mesh.
#
# The image has a Dockerfile (eval-agent/Dockerfile) and is built, smoke-tested
# and pushed by the AgentMesh release workflow along with the other three. It
# has not been pushed yet: it publishes at 0.2.1 the first time a release is
# cut, and until then nothing answers at this tag. To run it before that, build
# it yourself from the AgentMesh repository ROOT —
# `docker build -f eval-agent/Dockerfile -t <your-registry>/agentmesh-eval-agent:0.2.1 .`
# — push it somewhere the cluster can pull from, and change the image below.
# Delete this Deployment and its Service if you do not want it.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: eval-agent
  namespace: agentmesh
spec:
  # Safe to raise: nothing here is shared between pods. Note only that the rate
  # limiter is per-pod, so two replicas serve twice RATE_PER_MINUTE in total.
  replicas: 1
  selector:
    matchLabels: { app: eval-agent }
  template:
    metadata:
      labels: { app: eval-agent }
    spec:
      containers:
        - name: eval-agent
          image: ghcr.io/jeffrschneider/agentmesh-eval-agent:0.2.1
          env:
            # Set explicitly rather than inherited from the image, so that this
            # and containerPort below cannot drift apart.
            - name: PORT
              value: "8091"
            # Resolved by the BRIDGE, which fetches this URL out of the agent
            # card — so unlike the console's API_URL and NATS_WS_URL, an
            # in-cluster Service name is the RIGHT value here.
            - name: PUBLIC_BASE_URL
              value: http://eval-agent.agentmesh.svc.cluster.local:8091
            - name: RATE_PER_MINUTE
              value: "60"
          ports:
            - { name: http, containerPort: 8091 }
          readinessProbe:
            httpGet: { path: /healthz, port: 8091 }
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 100m, memory: 128Mi }

---
apiVersion: v1
kind: Service
metadata:
  name: eval-agent
  namespace: agentmesh
spec:
  selector:
    app: eval-agent
  ports:
    - { name: http, port: 8091, targetPort: 8091 }

---
# The A2A bridge: a mesh node that vouches for external A2A parties in both
# directions. Inbound, a stock A2A client reaches mesh agents through it;
# outbound, ATTACH puts the eval agent above on the mesh as an ordinary agent.
#
# The image has a Dockerfile (bridge-a2a/Dockerfile) and is built, smoke-tested
# and pushed by the AgentMesh release workflow along with the other three. Like
# the eval agent it has not been pushed yet: it publishes at 0.2.1 the first
# time a release is cut. Build it yourself before then with
# `docker build -f bridge-a2a/Dockerfile -t <your-registry>/agentmesh-bridge-a2a:0.2.1 .`
# from the repository ROOT — never from bridge-a2a/, which has no path to the
# SDK source the bridge imports.
#
# TWO THINGS THAT ONLY SHOW UP IF YOU ADAPT THAT DOCKERFILE OR THE ENV BELOW:
#
#   tsx is a RUNTIME dependency. The bridge is not compiled; it runs
#   `node --import tsx src/main.ts`, because it imports the SDK by relative
#   source path. tsx sits in devDependencies anyway, so `npm ci --omit=dev` on
#   its own yields an image that builds green and dies on its first line with
#   `Cannot find package 'tsx'`.
#
#   An empty string is a VALUE here, not an absence. MESH_URL, PORT and
#   PUBLIC_BASE_URL are read with `??`, so setting any of the three to "" below
#   overrides the code default instead of falling back to it — PORT: "" becomes
#   Number("") = 0 and the bridge binds a random port while the Service points
#   at 8090. All three carry real values below; leave them that way. Every other
#   variable is read with a truthy test, which is why ALLOW_ANONYMOUS and
#   TRUSTED_PROXIES can safely be "".
#
# A FIRST PUBLISH LANDS PRIVATE. A ghcr package is private until it is made
# public once, by hand, in the package settings, and an anonymous pull of a
# private package fails with a denied error indistinguishable from an image that
# was never published. Expect it once per package when 0.2.1 is first cut; a
# cluster pulling from a private package needs an imagePullSecret instead.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bridge
  namespace: agentmesh
spec:
  # One. Each replica is its own mesh node with its own hosted identities, and
  # each runs ATTACH independently, so a second replica registers a SECOND copy
  # of the eval agent under a different id. Discovery then returns two agents
  # where there is one service. Not a throughput dial.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: bridge }
  template:
    metadata:
      labels: { app: bridge }
    spec:
      containers:
        - name: bridge
          image: ghcr.io/jeffrschneider/agentmesh-bridge-a2a:0.2.1
          env:
            # The SDK speaks NATS over WebSocket, so 4443 and not 4222.
            - name: MESH_URL
              value: ws://nats-client.agentmesh.svc.cluster.local:4443
            - name: CREDS_FILE
              value: /creds/bridge.creds
            - name: PORT
              value: "8090"
            # Copied verbatim into every agent card the bridge generates, so it
            # is the address a remote A2A client comes back to. Set it to your
            # ingress hostname; the placeholder below only works for
            # kubectl port-forward.
            - name: PUBLIC_BASE_URL
              value: http://localhost:8090
            # WITH NEITHER OF THE NEXT TWO SET THE BRIDGE REFUSES EVERY INBOUND
            # CALL WITH 401, and says so at startup. That is the shipped state
            # on purpose: an admitted caller gets a node-vouched mesh identity,
            # so an open bridge is something an operator turns on knowingly.
            # `optional: true` means a missing Secret leaves the variable unset
            # rather than wedging the pod in CreateContainerConfigError — the
            # bridge then runs, closed, which is a state you can diagnose from
            # its own log.
            - name: API_KEYS
              valueFrom:
                secretKeyRef: { name: bridge-api-keys, key: api-keys, optional: true }
            # Only "1", "true", "yes" or "on" turn this on; anything else is
            # off and logs that it was not understood.
            - name: ALLOW_ANONYMOUS
              value: ""
            # BEHIND AN INGRESS THIS MUST BE THE INGRESS POD CIDR, NOT LOOPBACK.
            # The bridge believes X-Forwarded-For only from these addresses, and
            # the peer it actually sees is the ingress controller's POD, which
            # is never 127.0.0.1 from inside this container. Leave it empty or
            # set it to `loopback` behind an ingress and the header is ignored,
            # so every caller on the internet is identified as the ingress pod:
            # one mesh identity and one shared rate bucket for all of them, with
            # nothing in any log to say it happened. Get the range from your CNI
            # (`kubectl cluster-info dump | grep -m1 cluster-cidr`) or from the
            # ingress controller's own pod IP, and narrow it as far as you can.
            #   - name: TRUSTED_PROXIES
            #     value: "10.42.0.0/16"
            - name: TRUSTED_PROXIES
              value: ""
            - name: RATE_PER_MINUTE
              value: "30"
            # Attachment is attempted ONCE, at startup, and a failure is logged
            # and not retried. Kubernetes has no depends_on, so a bridge that
            # starts before the eval agent or before the services tier comes up
            # will run without the eval agent on the mesh, indefinitely, and
            # look healthy while doing it. The fix is a restart:
            #   kubectl -n agentmesh rollout restart deploy/bridge
            # It registers the remote PUBLIC deliberately: the bridge's inbound
            # side refuses to expose an unlisted or private agent, so an
            # unlisted eval agent is unreachable by the very check it serves.
            - name: ATTACH
              value: http://eval-agent.agentmesh.svc.cluster.local:8091
          ports:
            - { name: http, containerPort: 8090 }
          volumeMounts:
            - { name: creds, mountPath: /creds/bridge.creds, subPath: bridge.creds, readOnly: true }
          # /healthz answers 200 once the mesh connection is up and 503 before
          # it. The bridge binds its port BEFORE connecting to the mesh, on
          # purpose, so "listening" and "ready" are genuinely different states
          # and this probe reads the second one.
          readinessProbe:
            httpGet: { path: /healthz, port: 8090 }
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        # optional, so the pod still starts without it and the failure is a
        # readable "cannot connect to the mesh" rather than a stuck pod.
        - name: creds
          secret: { secretName: bridge-creds, optional: true }

---
apiVersion: v1
kind: Service
metadata:
  name: bridge
  namespace: agentmesh
spec:
  selector:
    app: bridge
  ports:
    - { name: http, port: 8090, targetPort: 8090 }
